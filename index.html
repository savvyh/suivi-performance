<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESHB - Suivi performances</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <div class="logo"><img src="assets/logo.png" alt="ESHB" /></div>
          <div>
            <h1>Référentiel de formation par catégories</h1>
            <p>Evian Sports Handball - Du Baby Hand au -18</p>
          </div>
        </div>
        <div class="add-player-bar">
          <input
            type="text"
            id="newPlayerName"
            placeholder="Nom de la joueuse"
            required
          />
          <input
            type="text"
            id="newPlayerCoach"
            placeholder="Entraîneur"
            required
          />
          <div class="date-field">
            <input
              type="text"
              id="newPlayerInterviewDateDisplay"
              class="date-field-display"
              placeholder="jj/mm/aaaa"
              inputmode="numeric"
              autocomplete="off"
              required
            />
            <input type="date" id="newPlayerInterviewDate" class="date-field-native" tabindex="-1" aria-hidden="true" />
            <svg
              class="date-field-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <line x1="16" y1="3" x2="16" y2="7"></line>
              <line x1="8" y1="3" x2="8" y2="7"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <input
            type="text"
            id="newPlayerInterviewNumber"
            placeholder="N° entretien"
            required
          />
          <select id="newPlayerCat"></select>
          <button class="btn btn-ice" id="addPlayerBtn">Ajouter</button>
        </div>
      </div>
    </header>

    <main>
      <div id="playerArea"></div>
    </main>

    <button
      class="scroll-top-btn"
      id="scrollTopBtn"
      title="Remonter en haut"
      aria-label="Remonter en haut"
    >
      ↑
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
